# TOML；原生主控需要 Python >= 3.11；节点 Python >= 3.10。旧容器字段仅供旧入口使用。
[native]
backend = "ssh"
log_tail_bytes = 65536
lease_seconds = 60

[cluster]
name = "isla-runner"
manager = "public-Super-Server"
container = "isla-condor"
image = "isla-runner/htcondor:25-ubuntu22"
# 容器统一使用 Ubuntu 22.04，避免把 jammy 软件包装进 Ubuntu 26.04。
apt_repository = "https://htcss-download.chtc.wisc.edu/repo/ubuntu/25.x"
apt_key = "https://htcss-download.chtc.wisc.edu/repo/keys/HTCondor-25.0-Key"
version_prefix = "25."
submit_user = "baiyifan"
submit_uid = 1005
submit_gid = 1005
uid_domain = "isla-runner.internal"
port = 9618
transfer_port_low = 9700
transfer_port_high = 9799
summary_limit_bytes = 1048576
log_tail_bytes = 65536

[[nodes]]
name = "public-Super-Server"
address = "192.168.104.13"
local = true
ssh_user = "baiyifan"
cpus = 128
priority = 100
weight = 4
hardware_gpus = 0
enable_gpus = false
work_dir = "scheduler/runtime"

[[nodes]]
name = "public-4090server"
address = "192.168.221.161"
local = false
ssh_user = "baiyifan"
cpus = 48
priority = 50
weight = 1
hardware_gpus = 2
# 开启前须安装 NVIDIA Container Toolkit，且 docker --gpus all 可用。
enable_gpus = false
# 每个节点均可指定绝对路径、~/ 路径或相对路径；remote_runtime 仍作为兼容别名。
work_dir = "~/isla-runner/scheduler/runtime"

[[nodes]]
name = "preston"
address = "192.168.103.89"
local = false
ssh_user = "baiyifan"
cpus = 32
priority = 100
weight = 1
hardware_gpus = 0
enable_gpus = false
work_dir = "~/isla-runner/scheduler/runtime"
